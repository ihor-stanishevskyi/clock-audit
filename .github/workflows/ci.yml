name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest

  image:
    name: build image and smoke-test the container
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # The build stage installs biolearn (and torch) to derive the clock
      # catalogue; none of it reaches the runtime image. The size assertion
      # below is what keeps that true.
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime        # never rely on stage order to pick the image
          load: true
          tags: clock-audit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 56 MB as of 2026-11-20. The ceiling is deliberately close to that: a
      # loose one let a 208 MB Lambda image through unnoticed.
      - name: runtime image must stay small
        run: |
          BYTES=$(docker image inspect clock-audit:ci --format '{{.Size}}')
          MB=$((BYTES / 1024 / 1024))
          echo "runtime image: ${MB} MB"
          test "$MB" -lt 150 || { echo "image grew past 150 MB - wrong stage, or torch leaked into the runtime image"; exit 1; }

      - name: start the container
        run: |
          docker run -d --name ca -p 8080:8080 clock-audit:ci
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "container never became healthy"; docker logs ca; exit 1

      - name: health
        run: |
          curl -fsS http://127.0.0.1:8080/health -o health.json
          cat health.json
          python3 - <<'PY'
          import json
          d = json.load(open("health.json"))
          assert d["status"] == "ok", d
          assert d["clock_count"] > 40, d
          print(f"ok: {d['clock_count']} clocks, biolearn {d['libraries']['biolearn']}")
          PY

      - name: a real audit through the running container
        run: |
          python3 - <<'PY'
          import json, urllib.request
          base = "http://127.0.0.1:8080"
          clocks = json.load(urllib.request.urlopen(base + "/clocks"))["clocks"]
          horvath = next(c for c in clocks if c["clock"] == "Horvathv1")
          assert horvath["required_sites"] == 353, horvath

          def audit(cpgs):
              req = urllib.request.Request(base + "/audit",
                  data=json.dumps({"cpgs": cpgs, "clocks": ["Horvathv1"]}).encode(),
                  headers={"content-type": "application/json"})
              return json.load(urllib.request.urlopen(req))["results"][0]

          # nothing the clock needs: the verdict must be refuse, not a number
          r = audit(["cg99999999", "not-a-cpg"])
          assert r["present_sites"] == 0 and r["verdict"] == "refuse", r
          print("zero coverage ->", r["verdict"])
          print("container answers correctly")
          PY

      - name: container logs on failure
        if: failure()
        run: docker logs ca
