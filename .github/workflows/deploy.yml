name: deploy

# Runs only after ci.yml has gone green on main: a broken image should never
# reach AWS. Authentication is OIDC - GitHub presents a short-lived identity,
# AWS checks it and hands back credentials valid for minutes. No stored keys.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write      # required to request the OIDC token
  contents: read

env:
  AWS_REGION: us-east-1
  FUNCTION: clock-audit
  ECR_REPO: clock-audit

jobs:
  deploy:
    # workflow_run fires on failure too, so check the conclusion.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The subject claim decides whether AWS lets us in, and it differs between
      # event types. Print it before assuming the role so a mismatch names itself
      # instead of arriving as a bare "Not authorized". Claims are not secrets;
      # the token they come from is never printed.
      - name: what identity is GitHub actually presenting
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          python3 - "$TOKEN" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          c = json.loads(base64.urlsafe_b64decode(payload))
          print("--- every claim, repr() so invisible characters show ---")
          for k in sorted(c):
              print(f"{k:24} {c[k]!r}")
          PY
          # Ask STS directly. AssumeRoleWithWebIdentity needs no credentials -
          # the token is the credential - so its raw error says why the role was
          # refused, where the action only reports "Not authorized". Only error
          # text is printed: a successful response carries real keys.
          echo "--- what STS itself says ---"
          OUT=$(curl -sS -X POST https://sts.amazonaws.com/ \
            -d "Action=AssumeRoleWithWebIdentity" \
            -d "Version=2011-06-15" \
            -d "RoleSessionName=diag" \
            --data-urlencode "RoleArn=arn:aws:iam::031391485774:role/clock-audit-deploy" \
            --data-urlencode "WebIdentityToken=$TOKEN")
          if printf '%s' "$OUT" | grep -q "<Error>"; then
            printf '%s' "$OUT" | tr '<' '\n' | grep -E '^(Code|Message)>' | sed 's/>/: /'
            exit 1
          fi
          echo "accepted - STS issued credentials for this token"

      - name: assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::031391485774:role/clock-audit-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: who am I
        run: aws sts get-caller-identity

      - name: make sure the image repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPO" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPO" \
                 --image-scanning-configuration scanOnPush=true >/dev/null
          echo "repository ready"

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: build and push the Lambda image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lambda
          provenance: false          # Lambda rejects images with an OCI attestation manifest
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/clock-audit:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: create or update the function
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/clock-audit:${{ github.sha }}
        run: |
          set -euo pipefail
          if aws lambda get-function --function-name "$FUNCTION" >/dev/null 2>&1; then
            echo "updating existing function"
            aws lambda update-function-code \
              --function-name "$FUNCTION" --image-uri "$IMAGE" >/dev/null
          else
            echo "creating function"
            aws lambda create-function \
              --function-name "$FUNCTION" \
              --package-type Image \
              --code ImageUri="$IMAGE" \
              --role "arn:aws:iam::031391485774:role/clock-audit-lambda-exec" \
              --timeout 30 --memory-size 1024 \
              --description "Coverage audit for DNA-methylation ageing clocks" >/dev/null
          fi
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"
          echo "function ready"

      # Enforce the wanted state, do not just check that something is there.
      # A URL created by hand in the console defaults to AWS_IAM auth, and a
      # create-if-missing guard walks straight past it: the URL exists, so the
      # guard is satisfied, and every anonymous request gets 403. So set the
      # auth type every run and (re)state the public invoke permission.
      - name: make sure it has a public URL that answers anonymously
        id: url
        run: |
          set -euo pipefail
          if aws lambda get-function-url-config --function-name "$FUNCTION" >/dev/null 2>&1; then
            aws lambda update-function-url-config \
              --function-name "$FUNCTION" --auth-type NONE >/dev/null
          else
            aws lambda create-function-url-config \
              --function-name "$FUNCTION" --auth-type NONE >/dev/null
          fi
          # Auth type NONE is not enough by itself. Lambda states the rule in
          # the body of its own 403: "Invoking a Function URL requires both the
          # lambda:InvokeFunctionUrl and lambda:InvokeFunction permissions."
          # Most write-ups show only the first, which is why a textbook-looking
          # policy kept refusing every request.
          for A in InvokeFunctionUrl InvokeFunction; do
            # The FunctionUrlAuthType condition is accepted on InvokeFunctionUrl
            # only - AWS rejects it on InvokeFunction - so that second grant
            # cannot be narrowed to URL calls. It costs nothing here: the URL is
            # deliberately public, the service holds no data and no credentials,
            # and it takes CpG identifiers rather than anyone's measurements.
            EXTRA=""
            [ "$A" = "InvokeFunctionUrl" ] && EXTRA="--function-url-auth-type NONE"
            if ERR=$(aws lambda add-permission \
                       --function-name "$FUNCTION" \
                       --statement-id "public-url-$A" \
                       --action "lambda:$A" --principal '*' \
                       $EXTRA 2>&1 >/dev/null); then
              echo "granted lambda:$A"
            elif printf '%s' "$ERR" | grep -q ResourceConflictException; then
              echo "lambda:$A already granted"
            else
              echo "$ERR"
              exit 1
            fi
          done
          AUTH=$(aws lambda get-function-url-config --function-name "$FUNCTION" \
                   --query AuthType --output text)
          echo "auth type: $AUTH"
          test "$AUTH" = "NONE"
          URL=$(aws lambda get-function-url-config --function-name "$FUNCTION" \
                  --query FunctionUrl --output text)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "$URL"

      # Deploying is not the same as working. Ask the live function the one
      # question whose right answer we know, and fail the deploy if it is wrong.
      - name: prove the deployed function actually answers
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          set -euo pipefail
          # Retry, because a fresh container image takes a moment to be ready -
          # but keep the last reply instead of discarding it. curl -f throws the
          # body and headers away, which is how four runs got the same bare 403
          # with nothing in the log to reason from.
          for i in $(seq 1 20); do
            CODE=$(curl -sS -o health.json -D headers.txt \
                     -w '%{http_code}' "${URL}health" || echo 000)
            [ "$CODE" = "200" ] && break
            echo "attempt $i: HTTP $CODE"
            sleep 5
          done
          if [ "$CODE" != "200" ]; then
            echo "--- response headers ---"; cat headers.txt
            echo "--- response body ---";    cat health.json; echo
            exit 1
          fi
          cat health.json
          python3 - <<'PY'
          import json, os, urllib.request
          base = os.environ["URL"].rstrip("/")
          d = json.load(open("health.json"))
          assert d["status"] == "ok" and d["clock_count"] > 40, d
          req = urllib.request.Request(base + "/audit",
              data=json.dumps({"cpgs": ["cg99999999"], "clocks": ["Horvathv1"]}).encode(),
              headers={"content-type": "application/json"})
          r = json.load(urllib.request.urlopen(req))["results"][0]
          assert r["present_sites"] == 0 and r["verdict"] == "refuse", r
          print(f"live: {d['clock_count']} clocks, zero coverage -> {r['verdict']}")
          PY

      - name: summary
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- URL: $URL"
            echo "- image tag: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
